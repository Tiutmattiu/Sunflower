name: Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Harbour and canon checks
        run: npm run test:harbour
      - name: Economy regression checks
        run: npm run test:production
      - name: Art manifest checks
        run: npm run test:visual
      - name: Production build
        run: npm run build
